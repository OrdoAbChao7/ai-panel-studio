[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-panel-studio-backend"
version = "0.1.0"
description = "Autonomous Multi-Agent Round-Table Debate Engine and Studio API"
authors = [{ name = "AI Panel Studio Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx-sse>=0.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "backend"]
addopts = "-v --import-mode=importlib"
markers = [
    "tier1: Tier 1 Feature Coverage Tests",
    "tier2: Tier 2 Boundary & Corner Case Tests",
    "tier3: Tier 3 Cross-Feature & Concurrency Tests",
    "tier4: Tier 4 Real-World Application Scenario Tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
